<!DOCTYPEhtml>
<html lang ="en">
  <head>
    <meta charset="utf-8">
    <title>Title web in the tab</title>
    <link rel="stylesheet" href="./style.css"/>
  </head>
</body>
  <!-- use section if want to dived content into section
        use </div> if want to group the content -->
  <section>
  <h1>main headline</h1>
  <p>Paragraf 1</p>
  <h2>sub headline</h2>
  <p>Paragraf 2</p>
  <a href="https://cdn-icons-png.flaticon.com/128/6590/6590965.png">
    <img src="https://cdn-icons-png.flaticon.com/128/6590/6590965.png" alt="This is a Picture Of Image Icon"/>
  </a>
  <p><a href="https://dapit2.github.io/web/">Hyperlink</a></p>
  <figure>
    <img src="https://www.wikitechy.com/step-by-step-html-tutorials/img/html-images/output-figure-caption-tag-in-html.png" alt="a image about the figure and figcaption">
    <figcaption>figcaption: <em>(em)</em> <strong>(strong)</strong></figcaption>
    <!-- use class to applied multiple element
          use id to applied specific unique element-->
    <h6 id="id">id</h6>
    <div class="box blue-box"></div>
    <div class="box red-box"></div>
  </section>
  <section>
    <h3>Unordered List</h2>
    <ul>
      <li>list 1</li>
      <li>list 2</li>
      <li>list 3</li>
    </ul>
    <h3>Ordered Lists</h2>
    <ol>
      <li>list 1</li>
      <li>list 2</li>
      <li>list 3</li>
    </ol>
  </section>
  <footer>
    <p>footer</p>
  </footer>
</body>
</html>
